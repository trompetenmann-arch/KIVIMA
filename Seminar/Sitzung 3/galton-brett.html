<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galton-Brett Simulation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body{margin:0;background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif}
    .panel{max-width:1100px;margin:0 auto;padding:16px}
    .card{background:#1e293b;border:1px solid #334155;border-radius:12px}
    canvas{display:block;width:100%}
    button{background:#e11d48;color:white;border:0;border-radius:8px;padding:8px 12px;font-weight:700}
  </style>
</head>
<body>
  <div class="panel">
    <h1 class="text-3xl font-bold text-rose-400 text-center">Galton-Brett</h1>
    <p class="text-center text-slate-300 mb-4">Die Binomialverteilung entdecken</p>
    <div class="card p-3 mb-3 flex gap-2 flex-wrap items-center">
      <button onclick="drop(1)">1 Kugel</button>
      <button onclick="drop(10)">10 Kugeln</button>
      <button onclick="drop(50)">50 Kugeln</button>
      <button onclick="resetBoard()" style="background:#0ea5e9">Zurücksetzen</button>
      <span id="total" class="ml-auto text-sm">Gesamt: 0</span>
    </div>
    <div class="card p-2"><canvas id="board" height="420"></canvas></div>
    <div class="card p-2 mt-3"><canvas id="hist" height="180"></canvas></div>
  </div>
<script>
const rows=8,bins=9;
let counts=Array(bins).fill(0), total=0, balls=[];
const board=document.getElementById('board'), bctx=board.getContext('2d');
const hist=document.getElementById('hist'), hctx=hist.getContext('2d');
let W,H,pegY,pegX,startY;
function resize(){W=board.clientWidth;board.width=W;H=board.height;pegY=(H*0.62)/rows;startY=36;pegX=(W-80)/bins;draw();drawHist();}
window.addEventListener('resize',resize);
function pegPos(r,c){const n=r+2,rowW=(n-1)*pegX,sx=(W-rowW)/2;return{x:sx+c*pegX,y:startY+r*pegY};}
function createBall(){let right=0,path=[];for(let r=0;r<rows;r++){right+=Math.random()<.5?1:0;path.push(right)};return{x:W/2,y:8,row:-1,tx:W/2,ty:startY,path,bin:right,color:`hsl(${Math.random()*360} 85% 60%)`}}
function drop(n){for(let i=0;i<n;i++)balls.push(createBall());}
function resetBoard(){counts=Array(bins).fill(0);total=0;balls=[];updateTotal();draw();drawHist();}
function updateTotal(){document.getElementById('total').textContent='Gesamt: '+total;}
function step(){const sp=3.5;for(let i=balls.length-1;i>=0;i--){const b=balls[i],dx=b.tx-b.x,dy=b.ty-b.y,d=Math.hypot(dx,dy);if(d<sp){b.x=b.tx;b.y=b.ty;b.row++;if(b.row>=rows){counts[b.bin]++;total++;balls.splice(i,1);updateTotal();}else{const p=pegPos(b.row,b.path[b.row]);b.tx=p.x;b.ty=p.y;}}else{b.x+=dx/d*sp;b.y+=dy/d*sp;}}}
function draw(){bctx.clearRect(0,0,W,H);const g=bctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#172554');g.addColorStop(1,'#1e1b4b');bctx.fillStyle=g;bctx.fillRect(0,0,W,H);
for(let r=0;r<rows;r++){for(let c=0;c<r+2;c++){const p=pegPos(r,c);bctx.beginPath();bctx.arc(p.x,p.y,3.6,0,Math.PI*2);bctx.fillStyle='#cbd5e1';bctx.fill();}}
const baseY=startY+rows*pegY+8; bctx.fillStyle='rgba(148,163,184,.5)';
const sx=(W-((rows)*pegX))/2-pegX/2; for(let i=0;i<=bins;i++) bctx.fillRect(sx+i*pegX,baseY,2,H-baseY);
for(let i=0;i<bins;i++){const maxH=H-baseY-8, r=4, left=sx+i*pegX+4,right=sx+(i+1)*pegX-4, bw=right-left, per=Math.max(1,Math.floor(bw/(r*2)));for(let j=0;j<counts[i];j++){const rr=Math.floor(j/per),cc=j%per,x=left+r+cc*(bw-r*2)/Math.max(1,per-1),y=H-r-4-rr*r*2;if(y<baseY)break;bctx.beginPath();bctx.arc(x,y,r,0,Math.PI*2);bctx.fillStyle='#fb7185';bctx.fill();}}
for(const b of balls){bctx.beginPath();bctx.arc(b.x,b.y,4,0,Math.PI*2);bctx.fillStyle=b.color;bctx.fill();}}
function drawHist(){const w=hist.clientWidth;hist.width=w;const h=hist.height;hctx.clearRect(0,0,w,h);const max=Math.max(1,...counts),bw=(w-30)/bins;for(let i=0;i<bins;i++){const bh=(counts[i]/max)*(h-35),x=15+i*bw,y=h-20-bh;hctx.fillStyle='#f43f5e';hctx.fillRect(x+2,y,bw-4,bh);hctx.fillStyle='white';hctx.font='10px sans-serif';hctx.textAlign='center';hctx.fillText(i,x+bw/2,h-6);}}
function loop(){step();draw();drawHist();requestAnimationFrame(loop);}resize();loop();
</script>
</body>
</html>
