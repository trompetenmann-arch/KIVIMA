<!doctype html>
<html lang="de" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galton-Brett Simulation</title>

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    html, body { height: 100%; margin: 0; }
    * { box-sizing: border-box; }
    :root { --wood-dark: #5C3A1E; --wood-mid: #8B5E3C; --wood-light: #C4956A; --wood-highlight: #D4A76A; --bg-main: #1a1a2e; --bg-card: #16213e; --accent: #e94560; --accent2: #0f3460; --text-main: #eaeaea; }
    body { font-family: 'Nunito', sans-serif; background: var(--bg-main); color: var(--text-main); }
    .wood-frame { background: linear-gradient(135deg, var(--wood-mid), var(--wood-dark)); border: 4px solid var(--wood-highlight); box-shadow: inset 0 0 12px rgba(0,0,0,0.5), 0 8px 32px rgba(0,0,0,0.4); border-radius: 12px; position: relative; }
    .wood-frame::before { content: ''; position: absolute; inset: 2px; border: 2px solid rgba(196,149,106,0.3); border-radius: 10px; pointer-events: none; }
    .wood-side-left, .wood-side-right { position: absolute; top: 0; bottom: 0; width: 18px; z-index: 5; }
    .wood-side-left { left: 0; background: linear-gradient(90deg, var(--wood-dark), var(--wood-mid), rgba(139,94,60,0.3)); border-radius: 12px 0 0 12px; }
    .wood-side-right { right: 0; background: linear-gradient(270deg, var(--wood-dark), var(--wood-mid), rgba(139,94,60,0.3)); border-radius: 0 12px 12px 0; }
    .wood-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 18px; background: linear-gradient(0deg, var(--wood-dark), var(--wood-mid)); border-radius: 0 0 12px 12px; z-index: 5; }
    .ball { position: absolute; border-radius: 50%; z-index: 10; pointer-events: none; }
    .btn-primary { background: var(--accent); color: white; font-weight: 700; border: none; border-radius: 8px; padding: 8px 18px; cursor: pointer; transition: all 0.2s; font-family: 'Nunito', sans-serif; }
    .btn-primary:hover { filter: brightness(1.15); transform: translateY(-1px); }
    .btn-secondary { background: var(--accent2); color: white; font-weight: 600; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 6px 14px; cursor: pointer; transition: all 0.2s; font-family: 'Nunito', sans-serif; }
    .btn-secondary:hover { background: #1a4a80; }
    .tab-active { background: var(--accent); color: white; }
    .tab-inactive { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); }
    .card { background: var(--bg-card); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 16px; }
    .speed-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; color: white; cursor: pointer; font-size: 18px; font-weight: 700; transition: all 0.15s; }
    .speed-btn:hover { background: rgba(255,255,255,0.2); }
    input[type="number"] { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: white; border-radius: 6px; padding: 6px 10px; font-family: 'Nunito', sans-serif; width: 70px; text-align: center; }
    input[type="number"]:focus { outline: 2px solid var(--accent); }
  </style>
</head>
<body class="h-full overflow-auto">
<div id="app" class="w-full min-h-full" style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #1a1a2e 100%);">
<header class="text-center pt-6 pb-3 px-4"><h1 id="main-title" class="text-3xl font-extrabold tracking-tight" style="color: var(--accent);">Galton-Brett</h1><p id="subtitle" class="text-base mt-1 opacity-70">Die Binomialverteilung entdecken</p></header>
<div class="max-w-7xl mx-auto px-4 pb-8"><div class="card mb-4">Nota: archivo actualizado por solicitud del usuario.</div></div>
</div>
</body>
</html>
